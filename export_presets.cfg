; Resource-only desktop pack. Use --export-pack; not an installer or release approval.
[preset.0]
name="Desktop resources"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter="assets/game/*.json,assets/game/*.txt,level_designs/published/*.json"
exclude_filter="docs/*,wiki/*,tools/*,tests/*,tmp/*,assets/inbox/*,assets/source/*,assets/generated/*,assets/game/farming/crops/source/*,assets/game/tiles/editor/source/*,assets/game/environment/source/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
