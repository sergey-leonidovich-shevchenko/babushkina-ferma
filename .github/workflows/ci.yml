name: Godot quality gate

on:
  push:
  pull_request:

jobs:
  wiki:
    name: Wiki quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install wiki tooling
        run: |
          npm install --global pnpm@11.19.0
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Download Godot 4.7.1
        run: |
          mkdir -p .ci
          curl -fsSL -o .ci/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q .ci/godot.zip -d .ci
          chmod +x .ci/Godot_v4.7.1-stable_linux.x86_64
      - name: Check wiki catalogs, sprites, TypeScript, production build and tests
        env:
          WIKI_GODOT_BIN: ${{ github.workspace }}/.ci/Godot_v4.7.1-stable_linux.x86_64
        run: |
          cd wiki
          pnpm install --frozen-lockfile
          pnpm check
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load visual audit baselines
        run: git fetch --no-tags --depth=1 origin 1b1c39af20b48559904b4a775135305690d0bd10 6b9cc2927374e345553ddb8d9ba7e2e66e6392ec 1621d49502cd244c1036168f9d235561b708b33a 6ade4a2c8a2fac640109d3365c69bd4b6ccadfc4 12e6e2c7ac30f87af839cdb8cd0e2a4d1e558ee5
      - name: Install quality gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh ripgrep fonts-noto-cjk python3-pil
      - name: Download Godot 4.7.1
        run: |
          mkdir -p .ci
          curl -fsSL -o .ci/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q .ci/godot.zip -d .ci
          chmod +x .ci/Godot_v4.7.1-stable_linux.x86_64
      - name: Check architecture
        run: zsh tools/check_architecture.sh
      - name: Run automated tests
        env:
          FARM_GODOT_BIN: ${{ github.workspace }}/.ci/Godot_v4.7.1-stable_linux.x86_64
        run: zsh run_tests.sh
      - name: Run gameplay smoke test
        env:
          FARM_GODOT_BIN: ${{ github.workspace }}/.ci/Godot_v4.7.1-stable_linux.x86_64
        run: zsh tools/smoke_test.sh
      - name: Enforce performance budget
        env:
          FARM_GODOT_BIN: ${{ github.workspace }}/.ci/Godot_v4.7.1-stable_linux.x86_64
        run: zsh tools/performance_gate.sh
