name: VPERF-004 transparent coverage

on:
  pull_request:
    paths:
      - '.github/workflows/vperf-004.yml'
      - 'tools/qa/performance/overdraw/**'
      - 'scripts/presentation/foliage_wind_batch.gd'
      - 'scripts/presentation/village_water_occlusion.gd*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-pass-cost:
    name: Transparent coverage and paired X11 timings
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VPERF_PASS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install X11 and verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fonts-liberation xvfb xauth openbox libgl1-mesa-dri libglx-mesa0
          python -m pip install Pillow==11.3.0
      - name: Download and verify Godot 4.7.1
        run: |
          owner_dir="$RUNNER_TEMP/vperf-004"
          mkdir -p "$owner_dir"
          archive="$owner_dir/godot.zip"
          curl -fsSL -o "$archive" https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$owner_dir"
          engine="$owner_dir/Godot_v4.7.1-stable_linux.x86_64"
          chmod +x "$engine"
          printf 'FARM_GODOT_BIN=%s\nVPERF_OUTPUT=%s\n' "$engine" "$owner_dir/evidence" >> "$GITHUB_ENV"
      - name: Capture fixed coverage views and run both route profiles
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' bash -eu -o pipefail -c '
            openbox --sm-disable > "$RUNNER_TEMP/vperf-004/window-manager.txt" 2>&1 &
            wm=$!
            trap '\''kill "$wm" 2>/dev/null || true'\'' EXIT
            python tools/run.py qa.performance.overdraw.collect --output "$VPERF_OUTPUT" |
              tee "$RUNNER_TEMP/vperf-004/collection.txt"
          '
      - name: Verify coverage and recompute all paired results
        run: |
          set -o pipefail
          python tools/run.py qa.performance.overdraw.verify --output "$VPERF_OUTPUT" --expected-head "$VPERF_PASS_EXPECTED_HEAD" |
            tee "$RUNNER_TEMP/vperf-004/summary.json"
      - name: Preserve raw captures, configuration and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vperf-004-overdraw
          path: |
            ${{ env.VPERF_OUTPUT }}/
            ${{ runner.temp }}/vperf-004/collection.txt
            ${{ runner.temp }}/vperf-004/summary.json
            ${{ runner.temp }}/vperf-004/window-manager.txt
          if-no-files-found: warn
          retention-days: 30
