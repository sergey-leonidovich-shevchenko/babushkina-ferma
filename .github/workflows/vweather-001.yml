name: VWEATHER-001 pause clock

on:
  pull_request:
    paths:
      - '.github/workflows/vweather-001.yml'
      - 'scripts/presentation/weather_visual_clock.gd*'
      - 'scripts/presentation/post_motion_frame.gd'
      - 'scripts/systems/action_lifecycle_system.gd'
      - 'scripts/systems/atmosphere_renderer.gd'
      - 'tools/qa/world/weather/**'
      - 'tests/suites/weather_visual_clock_suite.gd*'
      - 'docs/reports/visual-overhaul/vweather-001/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_weather:
    name: Weather clock native X11
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VWEATHER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Set isolated evidence paths
        run: |
          echo "FARM_GODOT_BIN=$RUNNER_TEMP/vweather-001/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "VWEATHER_OUTPUT=$RUNNER_TEMP/vweather-001/evidence" >> "$GITHUB_ENV"
      - name: Install rendering and reader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fonts-liberation xvfb xauth libgl1-mesa-dri libglx-mesa0
          python -m pip install Pillow==11.3.0
      - name: Download official pinned Godot 4.7.1
        run: |
          mkdir -p "$(dirname "$FARM_GODOT_BIN")"
          curl -fsSL -o "${FARM_GODOT_BIN}.zip" https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          GODOT_ZIP="${FARM_GODOT_BIN}.zip" python -c 'import hashlib,os,pathlib; assert hashlib.sha256(pathlib.Path(os.environ["GODOT_ZIP"]).read_bytes()).hexdigest() == "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"'
          unzip -q "${FARM_GODOT_BIN}.zip" -d "$(dirname "$FARM_GODOT_BIN")"
          chmod +x "$FARM_GODOT_BIN"
      - name: Collect genuine baseline and candidate frames
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/run.py qa.world.weather.collect --output "$VWEATHER_OUTPUT" |& tee "$RUNNER_TEMP/vweather-001/collection.txt"
      - name: Verify source, physical windows, paused pixels and independent viewports
        run: |
          set -o pipefail
          python tools/run.py qa.world.weather.verify --output "$VWEATHER_OUTPUT" --expected-head "$VWEATHER_EXPECTED_HEAD" --check-current-candidate | tee "$RUNNER_TEMP/vweather-001/verification.txt"
      - name: Preserve raw evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vweather-001-native
          path: |
            ${{ env.VWEATHER_OUTPUT }}/source.json
            ${{ env.VWEATHER_OUTPUT }}/inputs
            ${{ env.VWEATHER_OUTPUT }}/baseline/production-blobs.json
            ${{ env.VWEATHER_OUTPUT }}/baseline/*.txt
            ${{ env.VWEATHER_OUTPUT }}/baseline/*.launch.json
            ${{ env.VWEATHER_OUTPUT }}/baseline/1152
            ${{ env.VWEATHER_OUTPUT }}/baseline/1280
            ${{ env.VWEATHER_OUTPUT }}/candidate/production-blobs.json
            ${{ env.VWEATHER_OUTPUT }}/candidate/*.txt
            ${{ env.VWEATHER_OUTPUT }}/candidate/*.launch.json
            ${{ env.VWEATHER_OUTPUT }}/candidate/1152
            ${{ env.VWEATHER_OUTPUT }}/candidate/1280
            ${{ runner.temp }}/vweather-001/collection.txt
            ${{ runner.temp }}/vweather-001/verification.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
